name: CI/CD

on:
  push:
    branches-ignore:
    - "dependabot/**"
    paths:
    - "**"
    - "!docs/**"
    tags:
    - "v*"
  pull_request:
    paths:
    - "**"
    - "!docs/**"

env:
  LC_ALL: en_US.UTF-8

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    if: (github.repository == 'rotty3000/verz') && startsWith(github.ref, 'refs/tags/') && (github.event_name != 'pull_request')
    needs: [lint, test]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install Cross
      run: cargo install cross --git https://github.com/cross-rs/cross
    - name: Install UPX
      run: sudo apt-get update && sudo apt-get install -y upx-ucl
    - name: Update Cargo.toml version
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        VERSION=${TAG#v}
        sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
    - name: Build and Compress
      run: make compress
    - name: Prepare Release Assets
      run: |
        mkdir -p release-assets
        cp dist/x86_64-unknown-linux-musl/verz release-assets/verz-linux-amd64
        cp dist/aarch64-unknown-linux-musl/verz release-assets/verz-linux-arm64
        cp dist/x86_64-pc-windows-gnu/verz.exe release-assets/verz-windows-amd64.exe
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*
        generate_release_notes: true
    # NOTE: The Homebrew formula is updated by a self-hosted workflow in the
    # rotty3000/homebrew-tap repo (.github/workflows/update-formula.yml), which
    # polls this repo's public releases and bumps Formula/verz.rb using its own
    # built-in GITHUB_TOKEN. That avoids the cross-repo PAT (HOMEBREW_TAP_TOKEN)
    # this step used to require. For an instant bump after a release, run that
    # workflow manually ("Run workflow") instead of waiting for its schedule.

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Run lint
      run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Run tests
      run: cargo test
